mcp:
  port: 8080
  stdio-enabled: true
  http-enabled: true
  auth:
    enabled: true
    token: "changeme-in-production"
    env-var: "MCP_AUTH_TOKEN"
worldedit:
  backend: "auto"
  max-blocks-per-op: 50000
  require-selection: true  # true = requer pos1 != pos2 (rejeita regiões de 1 bloco). false = permite 1 bloco.
  async: true
server:
  restart-delay: 5
  stop-delay: 3
